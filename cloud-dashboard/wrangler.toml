# name은 Cloudflare에서 Git 연결로 이미 만들어진 프로젝트 이름과 반드시 같아야 한다.
name = "cog-log"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[assets]
directory = "public"
binding = "ASSETS"

# D1: 아래 database_id는 "wrangler d1 create cog-comm-log" 실행 결과 또는
# Cloudflare 대시보드(Workers & Pages → D1 → 데이터베이스 선택)에서 확인한
# Database ID로 바꾼다. 스키마 적용 방법은 docs/cloud-dashboard-setup.md 참고.
[[d1_databases]]
binding = "DB"
database_name = "cog-comm-log"
database_id = "8ec6b463-fac2-4075-b98e-d034184e58f1"

# SYNC_API_KEY: 대시보드 Secret 설정이 Git 연동 배포에 붙지 않는 문제가 있어
# wrangler.toml에 직접 넣는다. 이 값은 저장소에 평문으로 노출된다는 뜻이므로
# 실제 배포에서는 반드시 강력하고 유출돼도 큰 문제 없는 값으로 바꿀 것.
[vars]
SYNC_API_KEY = "1234"
